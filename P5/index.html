<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot League - Mi Edición</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas">Tu navegador no soporta el juego. Por favor, actualízalo.</canvas>
        
        <div id="touch-controls">
            <div class="d-pad">
                <button id="btn-up">▲</button>
                <div class="horizontal">
                    <button id="btn-left">◀</button>
                    <button id="btn-right">▶</button>
                </div>
                <button id="btn-down">▼</button>
            </div>
            <div class="action-buttons">
                <button id="btn-rotate-l">↺</button>
                <button id="btn-kick">CHUT</button>
                <button id="btn-rotate-r">↻</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
